# Log Audit - Source Configuration
# Format: TYPE|PATH
# Types: SYSTEM, AUTH, KERNEL, WEBSERVER, APP, SYSLOG
# Paths support glob patterns (processed by collect.sh via find)
# Lines starting with # are ignored

SYSLOG|/var/log/syslog
SYSLOG|/var/log/syslog.1
AUTH|/var/log/auth.log
AUTH|/var/log/auth.log.1
KERNEL|/var/log/kern.log
SYSTEM|/var/log/dmesg
SYSTEM|/var/log/boot.log
WEBSERVER|/var/log/nginx/access.log
WEBSERVER|/var/log/nginx/error.log
WEBSERVER|/var/log/apache2/access.log
WEBSERVER|/var/log/apache2/error.log
# APP|/var/log/myapp/app.log
# APP|/opt/myservice/logs/service.log
