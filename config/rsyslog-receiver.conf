# /etc/rsyslog.d/10-remote-receiver.conf
# Place this file on VOLTRON (the central log server).
# Enables TCP and UDP listeners on port 514 and writes
# each remote host's logs to /var/log/remote/<hostname>/

# ── Load input modules ────────────────────────────────────────────────────────
module(load="imudp")
module(load="imtcp")

input(type="imudp" port="514")
input(type="imtcp" port="514")

# ── Per-host log routing ──────────────────────────────────────────────────────
# Create a separate directory per sending host under /var/log/remote/
# The directory is created automatically by rsyslog's dynafile feature.

$template RemoteHostLog,"/var/log/remote/%HOSTNAME%/%PROGRAMNAME%.log"
$template RemoteHostAll,"/var/log/remote/%HOSTNAME%/all.log"

# Log everything from remote hosts to their own directory
if $fromhost-ip != "127.0.0.1" then {
    action(type="omfile" DynaFile="RemoteHostLog" FileCreateMode="0640" DirCreateMode="0750" FileOwner="syslog" FileGroup="adm")
    action(type="omfile" DynaFile="RemoteHostAll"  FileCreateMode="0640" DirCreateMode="0750" FileOwner="syslog" FileGroup="adm")
    stop
}
