# Remediation Rules Configuration
# Format: CATEGORY|PATTERN|SEVERITY|TITLE|REMEDIATION_STEPS
# CATEGORY: errors, warnings, auth, web, app (matches process.sh output files)
# SEVERITY: CRITICAL, HIGH, MEDIUM, LOW, INFO
# PATTERN: extended regex (case-insensitive grep -iE)
# REMEDIATION_STEPS: use \n for line breaks within a step, use ; to separate steps
#
# Lines starting with # are ignored. Blank lines are ignored.

# ── SSL / TLS ─────────────────────────────────────────────────────────────────
errors|failed to verify certificate|HIGH|TLS Certificate Verification Failure|1. Identify the affected service from the log source;2. Check certificate expiry: openssl s_client -connect <host>:<port> 2>/dev/null | openssl x509 -noout -dates;3. If expired, renew the certificate with your CA or Let's Encrypt: certbot renew;4. Verify the correct CA bundle is installed: update-ca-certificates;5. Restart the affected service after renewal

errors|certificate.*expir|HIGH|Expired Certificate Detected|1. List all certs and expiry on the host: for f in /etc/ssl/certs/*.pem; do openssl x509 -noout -subject -enddate -in "$f" 2>/dev/null; done;2. Renew expired certificates via your CA or: certbot renew --force-renewal;3. Update system CA store: sudo update-ca-certificates --fresh;4. Restart services using the renewed cert

errors|ssl.*handshake|MEDIUM|SSL Handshake Failure|1. Check TLS version compatibility between client and server;2. Ensure the server supports TLS 1.2+: openssl s_client -tls1_2 -connect <host>:<port>;3. Review cipher suites in /etc/ssl/openssl.cnf or the service config;4. Confirm clocks are synchronised (TLS handshake fails if time drift > 5 min): timedatectl status

# ── Authentication ────────────────────────────────────────────────────────────
auth|failed password.*root|CRITICAL|SSH Root Login Brute Force Attempt|1. Check how many attempts: grep "Failed password.*root" /var/log/auth.log | wc -l;2. Identify source IPs: grep "Failed password.*root" /var/log/auth.log | awk '{print $(NF-3)}' | sort | uniq -c | sort -rn;3. Block offending IPs: ufw deny from <ip> to any;4. Disable root SSH login: set PermitRootLogin no in /etc/ssh/sshd_config, then: systemctl restart sshd;5. Install and configure fail2ban: apt install fail2ban

auth|failed password|HIGH|Repeated SSH Authentication Failures|1. Count failures per IP: grep "Failed password" /var/log/auth.log | awk '{print $(NF-3)}' | sort | uniq -c | sort -rn | head -20;2. Block IPs exceeding threshold: ufw deny from <ip>;3. Enable fail2ban SSH jail: systemctl enable --now fail2ban;4. Consider key-based auth only: set PasswordAuthentication no in /etc/ssh/sshd_config

auth|invalid user|HIGH|SSH Login Attempts with Invalid Usernames|1. List invalid usernames being tried: grep "Invalid user" /var/log/auth.log | awk '{print $8}' | sort | uniq -c | sort -rn;2. Check for dictionary attack patterns;3. Block source IPs: ufw deny from <ip>;4. Consider changing the SSH port in /etc/ssh/sshd_config (security by obscurity, not a fix on its own);5. Ensure AllowUsers or AllowGroups is set in /etc/ssh/sshd_config

auth|authentication failure|MEDIUM|PAM Authentication Failure|1. Identify the service: grep "authentication failure" /var/log/auth.log | awk '{print $6}';2. Check PAM configuration for that service: cat /etc/pam.d/<service>;3. Verify account lockout status: faillock --user <username>;4. Reset lockout if legitimate: faillock --user <username> --reset

# ── System / Kernel ───────────────────────────────────────────────────────────
errors|oom|killer|CRITICAL|Out-of-Memory Killer Invoked|1. Identify killed processes: grep -i "oom\|killed process" /var/log/syslog | tail -50;2. Check current memory usage: free -h && cat /proc/meminfo;3. Find memory-hungry processes: ps aux --sort=-%mem | head -20;4. Check for memory leaks in application logs;5. Consider adding swap: fallocate -l 4G /swapfile && mkswap /swapfile && swapon /swapfile;6. Increase RAM or reduce workload on this host

errors|segfault|CRITICAL|Segmentation Fault Detected|1. Identify the process: grep "segfault" /var/log/syslog | awk '{print $5}' | sort | uniq -c;2. Check if the binary is corrupted: md5sum <binary> (compare with known good);3. Check for hardware errors: dmesg | grep -i "hardware error\|mce\|ecc";4. Run memory test: memtest86+ (requires reboot);5. Check disk health: smartctl -a /dev/sda;6. Update or reinstall the affected package: apt reinstall <package>

errors|disk.*full|filesystem.*full|no space left|CRITICAL|Disk Full|1. Check disk usage: df -h;2. Find large files: find / -xdev -size +100M -exec ls -lh {} \; 2>/dev/null | sort -k5 -rh | head -20;3. Check log directory sizes: du -sh /var/log/*;4. Truncate large logs if safe: truncate -s 0 /var/log/<file>;5. Set up log rotation: check /etc/logrotate.d/;6. Remove old packages: apt autoremove && apt clean

errors|kernel.*panic|CRITICAL|Kernel Panic|1. Review full panic details in dmesg: dmesg | grep -A 20 "Kernel panic";2. Check for recent kernel updates: dpkg -l linux-image-* | grep ^ii;3. Boot into previous kernel via GRUB;4. Check hardware: dmesg | grep -i "hardware error\|mce\|ecc";5. Run fsck on next boot: touch /forcefsck && reboot

# ── Services ──────────────────────────────────────────────────────────────────
errors|service.*failed|failed to start|HIGH|Systemd Service Failure|1. Identify the service: grep "failed to start\|service.*failed" /var/log/syslog | awk '{print $5}' | sort -u;2. Check service status: systemctl status <service>;3. View full logs: journalctl -u <service> -n 100 --no-pager;4. Attempt restart: systemctl restart <service>;5. Check for dependency issues: systemctl list-dependencies <service>;6. Review service file: cat /etc/systemd/system/<service>.service

errors|connection refused|MEDIUM|Connection Refused|1. Check if the target service is running: ss -tlnp | grep <port>;2. Verify the service is enabled: systemctl is-enabled <service>;3. Check firewall rules: ufw status verbose;4. Review application config for correct bind address/port;5. Check service logs: journalctl -u <service> -n 50

errors|timeout|MEDIUM|Connection or Operation Timeout|1. Check network connectivity to target: ping <host> && traceroute <host>;2. Verify the target service is healthy: curl -v http://<host>:<port>/health;3. Review system load: uptime && top -bn1 | head -20;4. Check for packet loss: mtr --report <host>;5. Review application timeout settings in config

# ── Web Server ────────────────────────────────────────────────────────────────
web| 5[0-9]{2} |HIGH|HTTP 5xx Server Errors|1. Check which URLs are returning 5xx: grep " 5[0-9][0-9] " /var/log/nginx/access.log | awk '{print $7}' | sort | uniq -c | sort -rn | head -20;2. Review nginx error log: tail -100 /var/log/nginx/error.log;3. Check backend service health: systemctl status <backend>;4. Review application logs for stack traces;5. Check disk space (common cause of 500s): df -h

web|upstream timed out|HIGH|Nginx Upstream Timeout|1. Check backend service health: systemctl status <backend-service>;2. Review upstream response time trends;3. Increase proxy timeout if justified: proxy_read_timeout 120s; in nginx config;4. Check backend application logs for slow queries or processing;5. Scale backend or add caching if load is the cause

web| 4[0-9]{2} |LOW|HTTP 4xx Client Errors|1. Identify top 404 paths: grep " 404 " /var/log/nginx/access.log | awk '{print $7}' | sort | uniq -c | sort -rn | head -20;2. Check for bot/scanner activity: grep " 404 " /var/log/nginx/access.log | awk '{print $1}' | sort | uniq -c | sort -rn | head -10;3. If a legitimate path is 404, check application routing config;4. Block scanners if necessary: ufw deny from <ip>

# ── Application ───────────────────────────────────────────────────────────────
app|traceback|exception|HIGH|Application Exception / Traceback|1. Extract the full traceback from logs;2. Identify the exception type and module;3. Search for the issue in application issue tracker or upstream bugs;4. Check recent code deployments that may have introduced the regression;5. Roll back last deployment if exception is new: git revert <commit>;6. Apply hotfix and redeploy

app|out of memory|heap|MEDIUM|Application Memory Pressure|1. Check JVM heap (Java) or process RSS: ps -o pid,rss,cmd -p <pid>;2. Increase memory limits in service config or Kubernetes resource limits;3. Profile for memory leaks: enable application-level profiling;4. Review recent changes that may have introduced a leak

# ── Network ───────────────────────────────────────────────────────────────────
errors|error while dialing|MEDIUM|Network Dial Failure|1. Test connectivity to target: curl -v <endpoint> or nc -zv <host> <port>;2. Check DNS resolution: dig <hostname>;3. Verify firewall allows outbound traffic: ufw status;4. Check if service account has correct network policy (Kubernetes);5. Review proxy or VPN configuration if applicable

warnings|refused|MEDIUM|Connection Refused to Remote Endpoint|1. Verify the remote service is running: ssh <host> systemctl status <service>;2. Check the port is open: nc -zv <host> <port>;3. Ensure firewall on remote host allows the connection;4. Check service binding address (0.0.0.0 vs 127.0.0.1)
